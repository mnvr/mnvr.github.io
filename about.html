<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">

  <title>About &mdash; Manav Rathi</title>

  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui;
      font-size: 17px;
      line-height: 1.55;
      --muted: color-mix(in srgb, CanvasText 55%, Canvas);
    }

    body {
      width: min(760px, calc(100% - 84px));
      margin: 38px auto 48px;
    }

    a {
      text-decoration: none;
    }

    main {
      display: grid;
      gap: 44px;
    }

    h2 {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 400;
      line-height: 1.5;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    p {
      margin: 0;
      font-weight: 450;
    }

    .entries {
      display: flex;
      gap: 22px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .entries a {
      letter-spacing: -.015em;
      font-weight: 500;
    }

    .xg {
      width: .9em;
      height: .9em;
      vertical-align: -.1em;
      fill: currentColor;
    }

    footer {
      margin-top: 64px;
    }

    footer a {
      font-size: 14px;
      color: var(--muted);
    }

    footer a:hover {
      color: inherit;
    }

    @media (max-width: 40em) {
      body {
        width: calc(100% - 2em);
      }
    }
  </style>

</head>

<body>

  <main>
    <section>
      <h2>About</h2>
      <p>Hello. I&rsquo;m Manav Rathi.</p>
    </section>

    <section>
      <h2>Elsewhere</h2>
      <ul class="entries">
        <li><a href="https://github.com/mnvr" target="_blank">GitHub</a></li>
        <li><a href="https://x.com/mnvrth" target="_blank"><svg class="xg" viewBox="0 0 24 24" aria-label="X"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg></a></li>
      </ul>
    </section>
  </main>

  <footer><a href="/">mnvr.in</a></footer>

</body>

</html>
