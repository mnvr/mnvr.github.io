<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">

  <title>About &mdash; Manav Rathi</title>

  <link rel="stylesheet" href="home-link.css">

  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui;
      font-size: 17px;
      line-height: 1.55;
      --muted: color-mix(in srgb, currentColor 55%, transparent);
    }

    body {
      width: min(760px, calc(100% - 84px));
      margin: 38px auto 48px;
    }

    a {
      text-decoration: none;
    }

    main {
      display: grid;
      gap: 44px;
    }

    h2 {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 400;
      line-height: 1.5;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    p {
      margin: 0;
      font-weight: 450;
    }

    .entries {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .entries a {
      letter-spacing: -.015em;
      font-weight: 500;
    }

    footer {
      display: flex;
      margin-top: 54px;
    }

    @media (max-width: 40em) {
      body {
        width: calc(100% - 2em);
      }
    }
  </style>

</head>

<body>

  <main>
    <section>
      <h2>About</h2>
      <p>Hello. I&rsquo;m Manav Rathi.</p>
    </section>

    <section>
      <h2>Elsewhere</h2>
      <ul class="entries">
        <li><a href="https://github.com/mnvr" target="_blank">GitHub</a></li>
        <li><a rel="me" href="https://mastodon.social/@mnvr" target="_blank">Mastodon</a></li>
        <li><a href="https://x.com/mnvrth" target="_blank">X</a></li>
      </ul>
    </section>
  </main>

  <footer class="home-link">
    <a href="/">mnvr.in <span aria-hidden="true">↖</span></a>
  </footer>

</body>

</html>
