<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">

  <title>Clinging &mdash; Manav Rathi</title>
  <meta name="description" content="There is no home to go back to">
  <link rel="stylesheet" href="/home-link.css">

  <style>
    :root {
      color-scheme: light dark;
      color: light-dark(#111, #e6e6e6);
      background: light-dark(#fff, #121212);
    }

    body {
      margin: 0;
      font-family: system-ui, sans-serif;
    }

    main {
      padding: 28px 28px 80px;
      width: fit-content;
      max-width: 640px;
      margin-left: clamp(0px, 8vw - 28px, 72px);
      font-size: 18px;
      line-height: 1.5;
    }

    header {
      font-size: .85em;
      margin-bottom: 2.4em;
      color: light-dark(#737373, #8a8a8e);
    }

    p {
      margin: 0 0 1em;
    }

    footer {
      display: flex;
      margin-top: 44px;
    }

    @media (max-width: 40em) {
      main {
        padding: 20px 22px 60px;
        margin-left: 0;
        font-size: 17px;
      }
    }
  </style>

</head>

<body>

  <main>
    <header><time datetime="2026-09-13">Sep 13, 2026</time></header>

    <p>
      I wish i could be an infant in my mother’s arm<br>
      Clinging<br>
      <br>
      There is no home to go back to<br>
      <br>
      Why do I walk these desolate roads<br>
      I don’t live here<br>
      I thought I did<br>
      But I don’t want to<br>
      <br>
      There is no home to go back to
    </p>

    <footer class="home-link">
      <a href="/">mnvr.in <span aria-hidden="true">↖</span></a>
    </footer>
  </main>

</body>

</html>
