<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">

  <title>Clinging &mdash; Manav Rathi</title>
  <meta name="description" content="There is no home to go back to">
  <link rel="stylesheet" href="/home-link.css">

  <style>
    :root {
      color-scheme: light dark;
      color: light-dark(#111, #e6e6e6);
      background: light-dark(#fff, #121212);
      --muted: color-mix(in srgb, currentColor 55%, transparent);
    }

    body {
      margin: 0;
      font-family: system-ui, sans-serif;
    }

    main {
      width: min(58ch, calc(100% - 84px));
      margin: 38px auto 80px;
      font-size: 17px;
      line-height: 1.55;
    }

    header {
      font-size: .85em;
      margin-bottom: 2.4em;
      color: light-dark(#737373, #8a8a8e);
    }

    p {
      margin: 0 0 1em;
    }

    .clinging-word {
      font-weight: 600;
    }

    footer {
      display: flex;
      margin-top: 44px;
    }

    @media (max-width: 40em) {
      main {
        width: calc(100% - 2em);
      }
    }
  </style>

</head>

<body>

  <main>
    <header><time datetime="2026-09-13">Sep 13, 2026</time></header>

    <p>
      I wish i could be an infant in my mother’s arms<br>
      <span class="clinging-word">Clinging</span><br>
      <br>
      There is no home to go back to<br>
      <br>
      Why do I walk these desolate roads<br>
      I don’t live here<br>
      I thought I did<br>
      But I don’t want to<br>
      <br>
      There is no home to go back to
    </p>

    <footer>
      <a class="home-link" href="/">mnvr.in</a>
    </footer>
  </main>

</body>

</html>
