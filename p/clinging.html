<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">

  <title>Clinging &mdash; Manav Rathi</title>
  <meta name="description" content="There is no home to go back to">

  <style>
    :root {
      color-scheme: light dark;
      color: light-dark(#111, CanvasText);
      font-family: system-ui;
      font-size: 17px;
      line-height: 1.55;
    }

    body {
      margin: 0;
    }

    main {
      display: flex;
      flex-direction: column;
      width: min(58ch, calc(100% - 84px));
      min-height: calc(100dvh - 38px - 56px);
      margin: 38px auto 56px;
    }

    p {
      margin: 0;
    }

    .clinging-word {
      font-weight: 600;
    }

    footer {
      margin-top: auto;
      padding-top: 44px;
    }

    footer a {
      font-size: 14px;
      color: color-mix(in srgb, CanvasText 55%, Canvas);
      text-decoration: none;
    }

    footer a:hover {
      color: inherit;
    }

    @media (max-width: 40em) {
      main {
        width: calc(100% - 2em);
        min-height: calc(100dvh - 38px - 38px);
        margin-bottom: 38px;
      }
    }
  </style>

</head>

<body>

  <main>
    <p>
      I wish i could be an infant in my mother’s arm<br>
      <span class="clinging-word">Clinging</span><br>
      <br>
      There is no home to go back to<br>
      <br>
      Why do I walk these desolate roads<br>
      I don’t live here<br>
      I thought I did<br>
      But I don’t want to<br>
      <br>
      There is no home to go back to
    </p>

    <footer>
      <a href="/">mnvr.in</a>
    </footer>
  </main>

</body>

</html>
