<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">

  <title>Langton&rsquo;s ant &mdash; Manav Rathi</title>
  <meta name="description" content="An ant walks a torus, flipping each square as it comes to it, turning left if it was empty, turning right otherwise.">

  <link rel="stylesheet" href="post.css">

  <style>
    body {
      margin: 0;
    }

    #ant {
      display: block;
      height: 100svh;
      width: 100%;
    }

    @media (prefers-color-scheme: dark) {
      #ant {
        filter: invert(1);
      }
    }
  </style>

</head>

<body>

  <canvas id="ant">Langton&rsquo;s ant</canvas>

  <article>
    <h3>Langton&rsquo;s ant</h3>

    <p>An ant walks a torus, flipping each square as it comes to it, turning left if it was empty, turning right otherwise.</p>

    <p>If you wait here long enough, you&rsquo;ll see it build a highway (nobody knows why), and run into its own past.</p>

    <p class="timestamp">Manav Rathi, <time datetime="2026-08-29">Aug 2026</time></p>
  </article>

  <footer><a href="/">mnvr.in</a></footer>

  <script>
    const CELL = 8;
    const TICK_MS = 150;

    const canvas = document.getElementById("ant");
    const ctx = canvas.getContext("2d");

    const ink = "rgb(0 0 0 / 12%)";
    const antInk = "rgb(0 0 0 / 35%)";

    let cols = 0;
    let rows = 0;
    let grid = new Uint8Array(0);
    let x = 0;
    let y = 0;
    let dir = 0;

    function resize() {
      const newCols = Math.ceil(canvas.clientWidth / CELL);
      const newRows = Math.ceil(canvas.clientHeight / CELL);
      if (newCols === cols && newRows === rows) return;
      const oldGrid = grid;
      const oldCols = cols;
      const oldRows = rows;
      cols = newCols;
      rows = newRows;
      grid = new Uint8Array(cols * rows);
      for (let r = 0; r < Math.min(rows, oldRows); r++)
        for (let c = 0; c < Math.min(cols, oldCols); c++)
          grid[r * cols + c] = oldGrid[r * oldCols + c];
      const dpr = devicePixelRatio;
      canvas.width = cols * CELL * dpr;
      canvas.height = rows * CELL * dpr;
      ctx.scale(dpr, dpr);
      x = Math.min(x, cols - 1);
      y = Math.min(y, rows - 1);
      ctx.fillStyle = ink;
      for (let r = 0; r < rows; r++)
        for (let c = 0; c < cols; c++)
          if (grid[r * cols + c]) ctx.fillRect(c * CELL, r * CELL, CELL, CELL);
    }

    resize();
    x = cols >> 1;
    y = rows >> 1;
    addEventListener("resize", resize);

    function step() {
      const i = y * cols + x;
      ctx.clearRect(x * CELL, y * CELL, CELL, CELL);
      if (grid[i]) {
        dir = (dir + 1) % 4;
        grid[i] = 0;
      } else {
        dir = (dir + 3) % 4;
        grid[i] = 1;
        ctx.fillStyle = ink;
        ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
      }
      if (dir === 0) y = (y - 1 + rows) % rows;
      else if (dir === 1) x = (x + 1) % cols;
      else if (dir === 2) y = (y + 1) % rows;
      else x = (x - 1 + cols) % cols;
    }

    function tick() {
      step();
      ctx.fillStyle = antInk;
      ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
    }

    let timer = setInterval(tick, TICK_MS);
    document.addEventListener("visibilitychange", () => {
      clearInterval(timer);
      if (!document.hidden) timer = setInterval(tick, TICK_MS);
    });
  </script>

</body>

</html>
